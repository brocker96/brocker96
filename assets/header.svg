<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">BrockerUA — Software Engineering and Infrastructure</title>
<desc id="desc">Minimal dark graphite GitHub banner with green accents and subtle architectural grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1110"/><stop offset="1" stop-color="#121A19"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64BB86"/><stop offset="1" stop-color="#A4E6B8"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#23362E" stroke-width="1" opacity=".45"/></pattern>
  <clipPath id="clip"><rect width="1200" height="330" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
